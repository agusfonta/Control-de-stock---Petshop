databases:
  - name: animall-db
    plan: free

services:
  - type: web
    name: animall-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: animall-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_ON_START
        value: true

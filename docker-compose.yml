services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: petshop
      POSTGRES_PASSWORD: petshop
      POSTGRES_DB: petshop
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://petshop:petshop@db:5432/petshop
      SECRET_KEY: cambiar-en-produccion
    depends_on:
      - db
volumes:
  pgdata:
